<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#221A2A">
<title>Blood on the Clocktower</title>
<link rel="stylesheet" href="/static/theme.css">
<style>
  main { max-width: 30rem; margin: 0 auto; padding: 1rem 1.1rem calc(5rem + env(safe-area-inset-bottom)); }
  body[data-layout="laptop"] main { max-width: 80rem; padding-bottom: 2rem; }

  /* --- bottom tabs, in thumb reach --- */
  .tabs {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 10; display: flex; justify-content: center;
    padding: 0 max(0.5rem, env(safe-area-inset-left)) env(safe-area-inset-bottom);
    background: var(--felt-deep); border-top: 1px solid var(--felt-line);
  }
  .tabs button {
    position: relative; flex: 1; max-width: 10rem; min-height: 3.2rem; border: 0; background: none; cursor: pointer;
    color: var(--on-felt-dim); font-weight: 500; box-shadow: inset 0 2px 0 transparent;
  }
  .tabs button[aria-current="page"] { color: var(--accent-text); font-weight: 700; box-shadow: inset 0 2px 0 var(--brass); }
  .tabs .fresh { position: absolute; top: 0.7rem; margin-left: 0.25rem; width: 0.45rem; height: 0.45rem; border-radius: 50%; background: var(--brass-bright); }

  .top { display: flex; justify-content: space-between; align-items: baseline; gap: 1rem; margin-bottom: 1.2rem; }
  .top h1 { font-size: var(--t-xl); color: var(--accent-text); }
  .top .when { font-size: var(--t-sm); color: var(--on-felt-dim); text-align: right; }
  section { margin-top: 1.6rem; }
  section > h2 { font-size: var(--t-xl); margin-bottom: 0.7rem; }
  .empty { color: var(--on-felt-dim); font-style: italic; }
  .centred { text-align: center; }
  .err { color: #ffb4a8; margin-top: 0.6rem; }

  /* --- join --- */
  .join { padding: 1.4rem; border-radius: 14px; }
  .join h2 { font-size: var(--t-2xl); margin-bottom: 0.4rem; }
  .join p { margin: 0 0 1rem; color: var(--ink-soft); }
  .join form { display: flex; gap: 0.5rem; }
  .join input { flex: 1; min-width: 0; padding: 0.6em 0.9em; border: 1px solid var(--ink-soft); border-radius: 999px; background: #fff8e6; }

  /* --- the nudge every phone shows --- */
  .call { display: block; width: 100%; margin-bottom: 1rem; padding: 0.8rem 1rem; border: 1px solid var(--brass); border-radius: 12px; background: var(--felt-deep); color: var(--on-felt); text-align: left; cursor: pointer; }
  .call b { font-family: var(--display); font-weight: 400; font-size: var(--t-lg); color: var(--accent-text); display: block; }

  /* --- role token hero --- */
  .hero { display: grid; justify-items: center; text-align: center; margin-top: 0.5rem; }
  .flip { background: none; border: 0; padding: 0; cursor: pointer; perspective: 900px; border-radius: 50%; }
  .flip .inner { position: relative; width: 15rem; height: 15rem; transition: transform 0.5s cubic-bezier(.3,.7,.3,1); transform-style: preserve-3d; }
  .flip.open .inner { transform: rotateY(180deg); }
  .face { position: absolute; inset: 0; backface-visibility: hidden; }
  .face.front { transform: rotateY(180deg); }
  .face .token { --size: 15rem; }
  .face .token .char { font-size: var(--t-2xl); }
  .face.back .token { background: radial-gradient(circle at 50% 50%, rgba(178, 58, 51, 0.35), transparent 62%), radial-gradient(circle at 38% 30%, #3B5446, var(--leather) 60%, #182620); }
  .face.back svg { width: 84%; height: 84%; }
  .hero .token.blank .char { font-size: var(--t-lg); padding: 0 1.5rem; }
  .hero .hint { margin-top: 0.9rem; color: var(--on-felt-dim); font-size: var(--t-sm); }
  .ability { margin: 1rem 0 0; max-width: 26rem; text-align: left; }
  .ability .team { font-family: var(--display); font-size: var(--t-lg); }
  .ability p { margin: 0.3rem 0 0; }
  .ability .line-state { color: var(--accent-text); font-weight: 500; }

  /* --- the thread --- */
  .messages { margin-top: 0.4rem; }
  .thread-head { display: flex; align-items: center; gap: 0.6rem; padding-bottom: 0.6rem; border-bottom: 1px solid var(--felt-line); }
  .thread-head .who { font-family: var(--display); font-size: var(--t-lg); color: var(--accent-text); }
  .seal { width: 1.9rem; height: 1.9rem; flex: none; border-radius: 50%; background: radial-gradient(circle at 38% 30%, #FDF5E2, var(--parchment) 55%, var(--parchment-dim)); box-shadow: inset 0 0 0 2px rgba(224,150,47,.6); display: grid; place-items: center; color: var(--oxblood); font-family: var(--display); font-weight: 900; font-size: 1.1rem; }
  .thread { display: flex; flex-direction: column; gap: 0.5rem; padding: 0.6rem 0; }
  .thread .when { font-family: var(--display); font-weight: 500; font-size: var(--t-sm); color: var(--on-felt-dim); text-align: center; margin: 0.4rem 0 0; }
  .bub { max-width: 84%; padding: 0.55rem 0.8rem; border-radius: 16px; line-height: 1.35; white-space: pre-wrap; box-shadow: 0 2px 6px rgba(0,0,0,.25); }
  .bub.st { align-self: flex-start; background: var(--parchment); color: var(--ink); border-bottom-left-radius: 4px; background-image: radial-gradient(circle at 20% 0%, rgba(255,255,255,.55), transparent 60%); display: flex; gap: 0.5rem; align-items: flex-start; }
  .bub.st .seal { width: 1.4rem; height: 1.4rem; font-size: 0.85rem; margin-top: 1px; }
  .bub.me { align-self: flex-end; background: var(--felt-deep); color: var(--on-felt); border: 1px solid var(--felt-line); border-bottom-right-radius: 4px; box-shadow: none; }
  .thread .state { align-self: flex-end; font-size: var(--t-xs); color: var(--on-felt-dim); margin: -0.2rem 0.4rem 0 0; }
  .card { align-self: stretch; border-radius: 12px; padding: 0.7rem 0.8rem; }
  .card.prompt { background: var(--parchment); color: var(--ink); border-left: 5px solid var(--brass); }
  .card.prompt .when { text-align: left; color: var(--ink-soft); margin: 0 0 0.2rem; }
  .card.prompt p { margin: 0 0 0.5rem; }
  .card.done { border: 1px dashed var(--brass); color: var(--on-felt); font-size: var(--t-sm); display: flex; align-items: center; gap: 0.6rem; }
  .card.done svg { color: var(--brass-bright); flex: none; }
  .masked { display: block; width: 100%; position: relative; border: 0; padding: 0; background: none; cursor: pointer; text-align: left; color: inherit; font: inherit; }
  .masked .blur { filter: blur(7px); pointer-events: none; user-select: none; min-height: 6rem; }
  .masked .tap { position: absolute; inset: 0; display: grid; place-items: center; font-family: var(--display); font-size: var(--t-xl); color: var(--accent-text); }
  .composer { display: flex; gap: 0.5rem; padding-top: 0.6rem; border-top: 1px solid var(--felt-line); }
  .composer input { flex: 1; min-width: 0; min-height: 44px; padding: 0.5em 0.9em; border-radius: 999px; border: 1px solid var(--felt-line); background: var(--felt-deep); color: var(--on-felt); }
  .composer .send { width: 44px; height: 44px; border-radius: 50%; border: 0; background: linear-gradient(180deg, var(--brass-bright), var(--brass)); color: var(--ink); font-size: 1.3rem; font-weight: 700; cursor: pointer; }
  .composer .send:disabled { opacity: 0.4; cursor: default; }

  /* --- prompts --- */
  .picks { display: flex; flex-wrap: wrap; gap: 0.4rem; margin: 0.6rem 0; }
  .pick { border: 1px solid var(--ink-soft); background: transparent; border-radius: 999px; padding: 0.35em 0.9em; cursor: pointer; font-family: var(--display); font-size: var(--t-md); color: var(--ink); }
  .pick[aria-pressed="true"] { background: var(--ink); color: var(--parchment); border-color: var(--ink); }
  .pick.dead { opacity: 0.6; }
  .miss { margin: 0.4rem 0 0; color: var(--oxblood); font-weight: 700; }
  .seq { list-style: none; display: flex; justify-content: center; gap: 0.7rem; margin: 0.6rem 0; padding: 0; counter-reset: n; }
  .seq li { counter-increment: n; position: relative; width: 3.4rem; height: 3.4rem; border-radius: 50%; display: grid; place-items: center; color: var(--ink); background: var(--parchment-dim); }
  .seq li::before { content: counter(n); position: absolute; top: -0.35rem; left: -0.35rem; width: 1.2rem; height: 1.2rem; border-radius: 50%; display: grid; place-items: center; font-size: var(--t-xs); font-weight: 700; background: var(--ink); color: var(--parchment); }
  .seq li.got { background: var(--brass-bright); }
  .seq .glyph { width: 2rem; height: 2rem; }
  .grid6 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 0.5rem; }
  .grid6 .cell { display: grid; justify-items: center; gap: 0.2rem; padding: 0.6rem 0.2rem 0.45rem; border: 1px solid var(--ink-soft); border-radius: 12px; background: rgba(255, 255, 255, 0.35); color: var(--ink); cursor: pointer; font-size: var(--t-xs); line-height: 1.1; }
  .grid6 .cell .glyph { width: 2.2rem; height: 2.2rem; }
  .grid6 .cell:disabled { background: var(--ink); color: var(--parchment); border-color: var(--ink); cursor: default; }
  .grid6 .cell:disabled span { font-weight: 700; font-size: var(--t-md); }

  /* --- town square and the vote --- */
  .vote-title { font-size: var(--t-xl); font-weight: 500; text-align: center; }
  .ring { position: relative; width: 100%; aspect-ratio: 1; max-width: 22rem; margin: 0.4rem auto 0; }
  .ring::before { content: ""; position: absolute; inset: 15%; border-radius: 50%; border: 1px dashed var(--felt-line); }
  .seat { position: absolute; transform: translate(-50%, -50%); text-align: center; width: 4.8rem; }
  .seat .dot { width: 2rem; height: 2rem; margin: 0 auto 2px; border-radius: 50%; background: var(--parchment); box-shadow: 0 0 0 2px var(--felt-deep); display: grid; place-items: center; color: var(--ink); font-size: var(--t-xs); font-weight: 700; transition: box-shadow .2s; }
  .seat .dot.me { box-shadow: 0 0 0 2px var(--felt-deep), 0 0 0 4px var(--brass-bright); }
  .seat .dot.dead { background: #262626; color: var(--on-felt-dim); }
  .seat .dot.hand { box-shadow: 0 0 0 2px var(--felt-deep), 0 0 0 5px var(--brass-bright), 0 0 14px 3px rgba(245,188,85,.5); font-size: 1rem; }
  .seat .dot.yes { background: var(--brass-bright); }
  .seat .dot.no { background: var(--ink-soft); color: var(--parchment); }
  .seat .dot.nom { background: var(--oxblood); color: var(--parchment); }
  .seat .who { font-family: var(--display); font-size: var(--t-sm); line-height: 1.1; overflow-wrap: anywhere; }
  .seat.dead .who { color: var(--on-felt-dim); text-decoration: line-through; }
  .seat small { display: block; font-size: 0.7rem; font-family: var(--body); }
  .ring .center { position: absolute; inset: 30%; display: grid; place-content: center; text-align: center; }
  .ring .center b { font-family: var(--display); font-size: var(--t-3xl); font-weight: 400; line-height: 1; color: var(--accent-text); }
  .ring .center span { font-size: var(--t-sm); color: var(--on-felt-dim); }
  .dial { position: absolute; inset: 26%; border-radius: 50%; background: radial-gradient(circle at 50% 45%, var(--felt), var(--felt-deep) 70%); border: 2px solid rgba(245,188,85,.5); box-shadow: inset 0 0 30px rgba(0,0,0,.5); }
  .dial .hand { position: absolute; left: 50%; top: 50%; width: 46%; height: 6px; margin-top: -3px; transform-origin: 0 50%; border-radius: 3px; background: linear-gradient(90deg, var(--brass), var(--brass-bright)); box-shadow: 0 0 10px rgba(245,188,85,.7); transition: transform .12s linear; }
  .dial .boss { position: absolute; left: 50%; top: 50%; width: 14px; height: 14px; margin: -7px 0 0 -7px; border-radius: 50%; background: var(--brass-bright); box-shadow: 0 0 0 3px var(--felt-deep); }
  .dial .count { position: absolute; inset: 0; display: grid; place-items: center; font-family: var(--display); font-size: 3.5rem; color: var(--brass-bright); }
  .handbox { margin-top: 0.8rem; }
  .big { width: 100%; min-height: 72px; border: 1px solid var(--brass-bright); border-radius: 16px; background: transparent; color: var(--brass-bright); font-family: var(--display); font-weight: 700; font-size: var(--t-2xl); cursor: pointer; transition: background .15s; }
  .big.up { background: linear-gradient(180deg, var(--brass-bright), var(--brass)); color: var(--ink); border-color: transparent; box-shadow: inset 0 1px 0 rgba(255,255,255,.35), 0 8px 24px rgba(245,188,85,.35); }
  .big:disabled { opacity: 0.45; cursor: default; }
  .crier { list-style: none; padding: 0; margin: 0.6rem 0 0; }
  .crier li { padding: 0.35rem 0; border-bottom: 1px solid var(--felt-line); }
  .verdict { margin-top: 1rem; padding: 1.2rem; border-radius: 14px; text-align: center; }
  .verdict h2 { font-size: var(--t-3xl); }

  /* --- almanac --- */
  .almanac > h2 { font-size: var(--t-xl); }
  .almanac h3 { font-size: var(--t-lg); margin: 1rem 0 0.3rem; color: var(--accent-text); }
  .almanac dl { margin: 0; }
  .almanac dt { font-family: var(--display); font-size: var(--t-lg); margin-top: 0.7rem; display: flex; align-items: center; gap: 0.45rem; }
  .almanac dt .glyph { width: 1.5em; height: 1.5em; }
  .almanac dd { margin: 0; padding-left: calc(1.5em + 0.45rem); color: var(--on-felt-dim); font-size: var(--t-sm); }

  /* --- laptop: two columns, no tabs --- */
  .cols { display: flex; gap: 2rem; align-items: flex-start; }
  .cols .col { flex: 1 1 24rem; min-width: 0; }
  .cols .col.right { flex: 1.3 1 28rem; }
  .cols .card { margin: 0; }
  .cols .messages .thread { max-height: 60vh; overflow-y: auto; }
  .panel { position: fixed; inset: 0; z-index: 20; overflow-y: auto; padding: 1.5rem 2rem; background: var(--felt); }
  .panel .btn { float: right; }
</style>
</head>
<body>
<main id="app"><p class="empty">Finding the table...</p></main>
<script type="module" src="/static/player.js"></script>
</body>
</html>
