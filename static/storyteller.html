<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Grimoire</title>
<link rel="stylesheet" href="/static/theme.css">
<style>
  html { font-size: 16px; }
  .layout { display: flex; flex-direction: column; min-height: 100vh; }
  .row { display: flex; flex-wrap: wrap; flex-grow: 1; align-items: stretch; }

  /* --- top bar --- */
  #topbar { display: flex; align-items: center; gap: 1.2rem; flex-wrap: wrap; padding: 0.7rem 1.5rem; background: var(--felt-deep); border-bottom: 1px solid var(--felt-line); }
  #topbar h1 { font-size: var(--t-xl); color: var(--accent-text); }
  #topbar .phase { font-family: var(--display); font-size: var(--t-lg); font-weight: 500; }
  #topbar .dim, .dim { color: var(--on-felt-dim); }
  #topbar .spacer { flex: 1; }
  #topbar .undo { display: flex; align-items: baseline; gap: 0.6rem; }
  #topbar .undo .cost { color: var(--accent-text); font-size: var(--t-sm); max-width: 18rem; }
  .btn.accent { color: var(--accent-text); }
  .phones-strip { display: inline-flex; align-items: center; gap: 0.5rem; padding: 0.15rem 0.25rem 0.15rem 0.75rem; border-radius: 999px; border: 1px solid var(--felt-line); font-size: var(--t-sm); }
  .gear { position: relative; }
  .gear summary { list-style: none; cursor: pointer; padding: 0.3rem 0.5rem; border-radius: 6px; box-shadow: inset 0 0 0 1px currentColor; display: inline-flex; }
  .gear summary::-webkit-details-marker { display: none; }
  .gear .menu { position: absolute; right: 0; top: 2.4rem; z-index: 20; width: 22rem; padding: 0.8rem 1rem; display: grid; gap: 0.6rem; background: var(--felt-deep); border: 1px solid var(--felt-line); border-radius: 10px; box-shadow: 0 12px 30px rgba(0,0,0,.5); font-size: var(--t-sm); }
  .gear .menu label { display: flex; align-items: center; gap: 0.5rem; }
  .gear .menu select { background: var(--felt); color: inherit; border: 1px solid var(--felt-line); border-radius: 6px; padding: 0.2em 0.4em; }
  .gear .menu .line { display: flex; gap: 0.5rem; align-items: center; flex-wrap: wrap; }

  /* --- the circle --- */
  .table { flex: 999 1 500px; min-width: 0; padding: 0.8rem 1.5rem; display: flex; align-items: center; justify-content: center; }
  .square { container-type: size; position: relative; width: min(100%, calc(100vh - 6rem)); aspect-ratio: 1; }
  .square::before { content: ""; position: absolute; inset: 9%; border-radius: 50%; border: 1px solid rgba(245, 188, 85, 0.4); box-shadow: 0 0 0 8px rgba(245, 188, 85, 0.16), inset 0 0 80px rgba(143, 211, 166, 0.07); pointer-events: none; }
  .square::after { content: ""; position: absolute; inset: 14%; border-radius: 50%; border: 1px dashed rgba(245, 188, 85, 0.2); pointer-events: none; }
  .spot, .center { z-index: 1; }
  .spot { position: absolute; transform: translate(-50%, -50%); display: grid; justify-items: center; text-align: center; }
  .spot .token { cursor: pointer; border: 0; }
  .square.seating .spot .token { cursor: grab; touch-action: none; }
  .spot.dragging { z-index: 5; transition: none; }
  .spot.dragging .token { cursor: grabbing; transform: scale(1.08); box-shadow: 0 0 0 3px var(--brass-bright), 0 14px 30px rgba(0,0,0,.45); }
  .spot.target .token { box-shadow: 0 0 0 3px var(--felt-deep), 0 0 0 6px var(--brass-bright); opacity: 0.75; }
  .spot .token:hover { filter: brightness(1.05); }
  .spot .seatno { position: absolute; top: -2px; left: -2px; width: 1.5rem; height: 1.5rem; border-radius: 50%; background: var(--felt-deep); color: var(--on-felt-dim); font-size: var(--t-xs); display: grid; place-items: center; z-index: 1; }
  .token .char small { display: block; font-family: var(--body); font-size: 0.72em; color: var(--ink-soft); margin-top: 2px; }
  .nameplate.nom { border-color: var(--brass-bright); color: var(--accent-text); }

  .center { position: absolute; inset: 25%; display: grid; place-content: center; justify-items: center; text-align: center; gap: 0.4rem; pointer-events: none; }
  .center h2 { font-size: clamp(2rem, 8cqmin, 4rem); color: var(--on-felt); }
  .center p { margin: 0; color: var(--on-felt-dim); }
  .center .qr { width: min(12rem, 26cqmin); background: #fff; padding: 6px; border-radius: 8px; }
  /* the vote clock: a dial at the centre, the hand sweeps from the nominee */
  .center:has(.dial) { inset: 25%; place-content: stretch; display: block; }
  .dial { position: absolute; inset: 0; border-radius: 50%; background: radial-gradient(circle at 50% 45%, var(--felt), var(--felt-deep) 70%); border: 2px solid rgba(245,188,85,.5); box-shadow: inset 0 0 40px rgba(0,0,0,.5), 0 0 0 6px rgba(21,15,27,.9); }
  .dial .hand { position: absolute; left: 50%; top: 50%; width: 46%; height: 7px; margin-top: -3px; transform-origin: 0 50%; border-radius: 4px; background: linear-gradient(90deg, var(--brass), var(--brass-bright)); box-shadow: 0 0 12px rgba(245,188,85,.7); transition: transform .12s linear; }
  .dial .boss { position: absolute; left: 50%; top: 50%; width: 18px; height: 18px; margin: -9px 0 0 -9px; border-radius: 50%; background: var(--brass-bright); box-shadow: 0 0 0 3px var(--felt-deep), 0 0 0 4px var(--brass); }
  .dial .count { position: absolute; inset: 0; display: grid; place-items: center; font-family: var(--display); font-size: clamp(3rem, 14cqmin, 8rem); color: var(--brass-bright); pointer-events: none; }
  .dial-text { position: absolute; left: 10%; right: 10%; top: 12%; text-align: center; }
  .dial-text h2.small { font-size: clamp(1.2rem, 4.5cqmin, 2rem); font-weight: 500; color: var(--on-felt); }
  .dial-text p { margin: 0.2rem 0 0; color: var(--on-felt-dim); }
  .dial-text .tiny { position: absolute; left: 0; right: 0; top: calc(100cqmin * 0.36); font-size: var(--t-sm); }
  .center .url { font-size: var(--t-lg); color: var(--on-felt); }

  /* --- the right column --- */
  #column { flex: 1 1 480px; max-width: 480px; min-width: 0; padding: 1.2rem 1.6rem 3rem; overflow-y: auto; max-height: calc(100vh - 3.4rem); box-shadow: -8px 0 24px rgba(0,0,0,.3); box-sizing: border-box; }
  @media (max-width: 1000px) { #column { max-width: none; max-height: none; } }
  #column > h2 { font-size: var(--t-2xl); }
  #column h2 .seat { font-family: var(--body); font-weight: 400; font-size: var(--t-md); color: var(--ink-soft); }
  #column .lede { color: var(--ink-soft); margin: 0.2rem 0 1.2rem; }
  #column h3 { font-size: var(--t-lg); margin: 1.6rem 0 0.5rem; }
  .drawer-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.6rem; }
  .script-card { margin: 1rem 0; padding: 1rem 1.2rem; border: 1px solid var(--parchment-dim); border-radius: 14px; background: rgba(255,255,255,.35); display: grid; gap: 0.3rem; }
  .script-card h3 { margin: 0; font-size: var(--t-2xl); }
  .script-card p { margin: 0; }
  .script-card .btn { justify-self: start; margin-top: 0.4rem; }
  .linkbox { display: flex; gap: 0.5rem; align-items: center; padding: 0.5rem 0.75rem; border: 1px solid var(--parchment-dim); border-radius: 10px; background: #fff8e6; }
  .linkbox span { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .row-line { display: flex; align-items: center; gap: 0.6rem; padding: 0.4rem 0; border-top: 1px solid var(--parchment-dim); }
  .tag { font-size: var(--t-xs); font-weight: 700; padding: 0 0.5rem; border-radius: 999px; background: var(--parchment-dim); color: var(--ink-soft); }
  .card-accent { margin-top: 1.4rem; padding: 0.9rem 1rem; border: 1px solid var(--brass); border-radius: 10px; background: rgba(224,150,47,.12); }
  .card-accent h3 { margin-top: 0; }
  .card-soft { margin: 1rem -0.75rem 0; padding: 0.75rem; background: rgba(255,255,255,.35); border-radius: 10px; }
  .card-soft .disp { font-family: var(--display); font-size: var(--t-lg); font-weight: 500; }
  .card-soft .state { font-size: var(--t-xs); font-weight: 700; color: var(--moss); }
  .card-soft.live { box-shadow: 0 0 0 2px var(--brass); }
  .chip.yes { background: var(--ink); color: var(--parchment); border-color: var(--ink); }
  .note.hint { padding: 0.5rem 0.75rem; border-radius: 8px; background: rgba(224,150,47,.2); color: var(--ink); }
  details.tools.small { margin-top: 0.5rem; }
  details.tools.small summary { font-size: var(--t-sm); font-family: var(--body); color: var(--ink-soft); }
  .role-line { display: flex; align-items: center; gap: 0.4rem; font-family: var(--display); font-size: var(--t-lg); margin-top: 0.4rem; flex-wrap: wrap; }
  .role-line .glyph { width: 1.4em; height: 1.4em; }
  .toggles { display: flex; flex-wrap: wrap; gap: 0.4rem; margin: 0.6rem 0; }
  .tog { border: 1px solid var(--ink-soft); background: transparent; border-radius: 999px; padding: 0.2em 0.75em; font: 500 var(--t-sm) var(--body); color: var(--ink); cursor: pointer; }
  .tog[aria-pressed="true"] { background: var(--ink); color: var(--parchment); border-color: var(--ink); }
  .picks { display: flex; flex-wrap: wrap; gap: 0.4rem; margin: 0.5rem 0; }
  .pick { display: grid; justify-items: center; gap: 2px; min-width: 4rem; padding: 0.4rem 0.3rem; border: 1px solid var(--ink-soft); border-radius: 10px; background: transparent; font: 500 var(--t-xs) var(--body); color: var(--ink); cursor: pointer; }
  .pick .glyph { width: 1.5rem; height: 1.5rem; }
  .pick[aria-pressed="true"] { background: var(--ink); color: var(--parchment); border-color: var(--ink); }
  .rem.big { font-size: var(--t-sm); padding: 2px 4px 2px 10px; display: inline-flex; align-items: center; gap: 0.3rem; }
  .rem .x { background: none; border: 0; color: inherit; cursor: pointer; padding: 0 4px; font: inherit; }
  .picker { padding: 0.5rem; border: 1px dashed var(--ink-soft); border-radius: 8px; }
  .thread { display: flex; flex-direction: column; gap: 0.35rem; }
  .msg-row { display: grid; grid-template-columns: 9rem 1fr; gap: 0.6rem; align-items: baseline; width: 100%; text-align: left; padding: 0.55rem 0; border: 0; border-top: 1px solid var(--parchment-dim); background: none; font: inherit; color: inherit; cursor: pointer; }
  .msg-row .who { font-family: var(--display); font-size: var(--t-lg); display: flex; gap: 0.4rem; align-items: center; }
  .msg-row .last { color: var(--ink-soft); font-size: var(--t-sm); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .msg-row.unread .who { color: var(--oxblood); }
  .badge { font: 700 var(--t-xs) var(--body); background: var(--oxblood); color: var(--parchment); border-radius: 999px; padding: 0 0.5rem; }
  .bub { max-width: 85%; padding: 0.45rem 0.75rem; border-radius: 14px; font-size: var(--t-sm); line-height: 1.35; white-space: pre-wrap; }
  .bub.them { align-self: flex-start; background: #fff8e6; border: 1px solid var(--parchment-dim); border-bottom-left-radius: 4px; }
  .bub.me { align-self: flex-end; background: var(--felt-deep); color: var(--on-felt); border-bottom-right-radius: 4px; }
  .field { display: grid; gap: 0.25rem; margin: 0.7rem 0; }
  .field > span { font-size: var(--t-sm); color: var(--ink-soft); }
  .line { display: flex; flex-wrap: wrap; align-items: center; gap: 0.5rem; margin: 0.6rem 0; }
  .acts { display: flex; flex-wrap: wrap; gap: 0.4rem; margin: 0.6rem 0; }
  .paper select, .paper input, .paper textarea { background: #fff8e6; border: 1px solid var(--parchment-dim); border-radius: 8px; padding: 0.35em 0.55em; color: var(--ink); }
  .paper textarea { width: 100%; min-height: 4.5rem; resize: vertical; }
  .paper input[type=checkbox] { accent-color: var(--ink); }
  .warn { margin: 0.4rem 0; padding: 0.4rem 0.7rem; border-left: 4px solid var(--oxblood); background: rgba(178, 58, 51, 0.08); }
  .note { font-size: var(--t-sm); color: var(--ink-soft); margin: 0.3rem 0; }
  .details { display: grid; gap: 0.3rem; padding-bottom: 0.6rem; border-bottom: 1px solid var(--parchment-dim); }
  .details .role { font-family: var(--display); font-size: var(--t-lg); display: flex; align-items: center; gap: 0.4rem; }
  .details .role .glyph { width: 1.6em; height: 1.6em; }
  .details .kind { font-size: var(--t-sm); color: var(--ink-soft); }
  .details p { margin: 0; font-size: var(--t-sm); line-height: 1.4; }
  .details .believed { padding-left: 0.6rem; border-left: 3px solid var(--poison); }

  ol.order { list-style: none; padding: 0; margin: 0; }
  .step { position: relative; padding: 0.6rem 0 0.6rem 2.5rem; border-top: 1px solid var(--parchment-dim); }
  .step.done, .step.skipped { color: var(--ink-soft); }
  .step.open { background: rgba(255,255,255,.35); margin: 0 -0.75rem; padding: 0.75rem 0.75rem 0.9rem 3.25rem; border-radius: 10px; border-top: 0; }
  .num { position: absolute; left: 0; top: 0.55rem; width: 1.75rem; height: 1.75rem; border-radius: 50%; display: grid; place-items: center; font-family: var(--display); font-weight: 700; background: var(--parchment-dim); color: var(--ink); }
  .step.open .num { left: 0.75rem; top: 0.75rem; background: var(--brass); }
  .num.done { color: var(--moss); }
  .step .head { display: flex; justify-content: space-between; gap: 0.5rem; align-items: baseline; cursor: pointer; background: none; border: 0; padding: 0; width: 100%; text-align: left; font: inherit; color: inherit; }
  .stitle { font-family: var(--display); font-weight: 500; font-size: var(--t-lg); }
  .note.inline { display: inline; margin: 0; }
  .note.red { color: var(--oxblood); }
  .step .result { font-size: var(--t-sm); margin-top: 2px; display: flex; gap: 0.5rem; align-items: center; flex-wrap: wrap; }
  .pill { display: inline-block; font-size: var(--t-xs); font-weight: 700; padding: 1px 9px; border-radius: 999px; background: var(--lapis); color: var(--parchment); white-space: nowrap; }
  .pill.wait { background: transparent; color: var(--oxblood); border: 1px dashed var(--oxblood); }
  .pill.calm { background: var(--parchment-dim); color: var(--ink-soft); }
  .question { font-weight: 700; margin: 0.4rem 0; }
  .phones { display: flex; flex-wrap: wrap; gap: 0.35rem; margin: 0 0 1rem; }
  .phone { padding: 1px 10px; border-radius: 999px; font-size: var(--t-xs); border: 1px solid var(--moss); color: var(--moss); }
  .phone.wait { border: 1px dashed var(--oxblood); color: var(--oxblood); }
  .death { margin: 2px 0; }
  .death.linked { padding-left: 1rem; }
  .flag { display: inline-block; font-size: var(--t-xs); font-weight: 700; padding: 0 0.5rem; border-radius: 999px; background: var(--oxblood); color: var(--parchment); }
  .answer { font-weight: 700; }

  .chips { display: flex; flex-wrap: wrap; gap: 0.35rem; margin: 0.5rem 0; }
  .chip { border: 1px solid var(--ink-soft); background: transparent; border-radius: 999px; padding: 0.2em 0.75em; cursor: pointer; color: var(--ink); }
  .chip[aria-pressed="true"] { background: var(--ink); color: var(--parchment); border-color: var(--ink); }
  .chip.ghost { border-style: dashed; }
  .nom { padding: 0.6rem 0; border-top: 1px solid var(--parchment-dim); }
  .nom .tally { font-family: var(--display); font-size: var(--t-lg); }
  .tally.enough { color: var(--oxblood); }
  .crier { list-style: none; padding: 0; margin: 0; }
  .crier li { padding: 0.25rem 0; }
  .verdict { font-size: var(--t-3xl); }
  details.log, details.tools { margin-top: 1.6rem; }
  details.log summary, details.tools summary { cursor: pointer; font-family: var(--display); font-size: var(--t-lg); }
  details.log ol { padding-left: 1.2rem; font-size: var(--t-sm); color: var(--ink-soft); max-height: 18rem; overflow-y: auto; }
  .toast { position: fixed; bottom: 1.2rem; left: 50%; transform: translateX(-50%); background: var(--oxblood); color: var(--parchment); padding: 0.7rem 1.2rem; border-radius: 10px; box-shadow: 0 6px 20px rgba(0,0,0,.4); z-index: 30; }
</style>
</head>
<body>
<div class="layout">
  <header id="topbar"></header>
  <div class="row">
    <div class="table"><div class="square" id="square"></div></div>
    <aside class="paper" id="column"></aside>
  </div>
</div>
<div id="toast" role="status"></div>
<script type="module" src="/static/storyteller.js"></script>
</body>
</html>
